name: Build Water POS Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-pos/**'
      - '.github/workflows/android-pos-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build installable debug APK
        working-directory: android-pos
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp android-pos/app/build/outputs/apk/debug/app-debug.apk Water-POS-v1.2.9.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Water-POS-v1.2.9-APK
          path: Water-POS-v1.2.9.apk
          if-no-files-found: error
