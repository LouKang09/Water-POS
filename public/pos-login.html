<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d6b69">
  <title>INYOU Water POS Login</title>
  <link rel="icon" type="image/jpeg" href="/brand/inyou-official.jpg">
  <link rel="stylesheet" href="/styles.css?v=20261008-7">
  <link rel="stylesheet" href="/pos-login.css?v=20261008-7">
</head>
<body class="pos-login-page">
  <main class="pos-login-shell">
    <section class="pos-login-card">
      <div class="pos-login-brand">
        <img class="pos-login-logo" src="/brand/inyou-official.jpg?v=20261008-7" alt="INYOU Water Supply Co.">
        <div>
          <p class="eyebrow">INYOU WATER SUPPLY CO.</p>
          <h1>Water POS</h1>
          <p id="loginSubtitle">POS user sign in</p>
        </div>
      </div>

      <div id="setupNotice" class="login-notice hidden">
        <strong>First POS user setup</strong>
        <span>No cashier account exists yet. Create the first POS user below.</span>
      </div>

      <form id="posLoginForm" class="pos-login-form">
        <label id="nameField" class="field hidden">
          <span>Name</span>
          <input id="posName" autocomplete="name" maxlength="120" placeholder="Cashier / POS user name">
        </label>

        <label class="field">
          <span>Email</span>
          <input id="posEmail" type="email" autocomplete="username" required placeholder="name@example.com">
        </label>

        <label class="field">
          <span>Password</span>
          <div class="pos-password-control">
            <input id="posPassword" type="password" autocomplete="current-password" required placeholder="Enter password">
            <button class="pos-password-toggle" type="button" data-target="posPassword" aria-label="Show password">Show</button>
          </div>
        </label>

        <label id="confirmField" class="field hidden">
          <span>Confirm Password</span>
          <div class="pos-password-control">
            <input id="posConfirmPassword" type="password" autocomplete="new-password" placeholder="Repeat password">
            <button class="pos-password-toggle" type="button" data-target="posConfirmPassword" aria-label="Show password">Show</button>
          </div>
        </label>

        <div id="posLoginError" class="login-error"></div>
        <button id="posLoginButton" class="primary-button full" type="submit">Log in to POS</button>
      </form>

      <p class="login-footnote">This login is for POS/cashier access only. Admin uses the separate Admin login.</p>
    </section>
  </main>

  <script src="/pos-login.js?v=20261006-2"></script>
</body>
</html>
